<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>iOS Boot Screen</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" class="ios-shell">
  <div class="aurora-blob aurora-a"></div>
  <div class="aurora-blob aurora-b"></div>
  <div class="grain"></div>

  <!-- ============ HOME SCREEN ============ -->
  <main id="home" class="home-main">
    <div class="home-inner fade-up-slow">
      <div class="home-icon orb-glass orb-wrap breathe" style="position:relative;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v4M12 17v4M5 12H3M21 12h-2M6.3 6.3 5 5M19 19l-1.3-1.3M6.3 17.7 5 19M19 5l-1.3 1.3" />
          <circle cx="12" cy="12" r="3.4"></circle>
        </svg>
      </div>

      <h1 class="home-title">Chào mừng trở lại</h1>
      <p class="home-sub">Hệ thống đã khởi động xong. Đây là màn hình sau khi loading kết thúc.</p>

      <button id="replayBtn" type="button" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" />
        </svg>
        Xem lại màn hình loading
      </button>

      <button id="autoReplayBtn" type="button" class="btn-pill">
        <span id="autoDot" class="dot is-on ticker-dot"></span>
        <span id="autoLabel">Tự động phát lại: Bật</span>
      </button>

      <div class="control-group">
        <div class="control-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-4" /></svg>
          Tốc độ nhảy số
        </div>
        <div id="speedGroup" class="pill-group liquid-glass" role="group" aria-label="Tốc độ màn hình khởi động"></div>
        <p id="speedCaption" class="control-caption blur-replace"></p>
      </div>

      <div class="control-group">
        <div class="control-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 2a10 10 0 0 0 0 20 3 3 0 0 0 0-6h-1a2 2 0 0 1 0-4h4" /></svg>
          Giao diện khởi động
        </div>
        <div id="themeGroup" class="pill-group liquid-glass" role="group" aria-label="Giao diện màn hình khởi động"></div>
      </div>
    </div>

    <div class="loader-bottom-bar" style="position:absolute;bottom:24px;">
      <div class="home-bar"></div>
    </div>
  </main>

  <!-- ============ BOOT LOADER ============ -->
  <div id="loader" class="ios-overlay ink-flip" role="status" aria-live="polite" hidden>
    <div class="boot-backdrop"></div>
    <div class="boot-beam"></div>
    <div class="boot-stars"></div>

    <span class="boot-comet" style="top:8%; left:-12%; animation-delay:0.8s; animation-duration:9s;"></span>
    <span class="boot-comet" style="top:32%; left:-20%; animation-delay:4.6s; animation-duration:11s;"></span>
    <span class="boot-comet" style="top:-4%; left:22%; animation-delay:7.9s; animation-duration:10s;"></span>

    <div id="bootRings" class="boot-rings"></div>
    <div id="auroraLayer" class="aurora-layer">
      <div class="aurora-blob aurora-a"></div>
      <div class="aurora-blob aurora-b"></div>
      <div class="aurora-blob aurora-c"></div>
    </div>

    <div class="boot-vignette"></div>
    <div class="progressive-blur-top"></div>
    <div class="progressive-blur-bottom"></div>
    <div class="grain"></div>

    <!-- Dynamic Island -->
    <div class="island-wrap">
      <div id="islandSoft" class="soft-in">
        <div id="island" class="island">
          <div class="glass-dispersion" style="border-radius:9999px; opacity:0.4;"></div>
          <div class="island-rim"></div>
          <div id="islandIcon" class="island-icon"></div>
          <span id="islandTitle" class="island-title text-shimmer"></span>
          <span class="island-percent">
            <span id="islandRoll" class="tabular-roll"></span><span class="percent-sign">%</span>
          </span>
        </div>
      </div>
    </div>

    <!-- Centre stack -->
    <div class="center-wrap">
      <div class="center-inner">
        <div id="bootHalo" class="boot-halo"></div>

        <div id="pulseWaves" class="pulse-waves">
          <div class="pulse-wave"></div>
          <div class="pulse-wave" style="animation-delay:1.6s"></div>
        </div>

        <div id="arcWrap" class="arc-wrap">
          <svg class="arc-svg" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" />
            <circle id="arcCircle" cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" transform="rotate(-90 100 100)" />
            <circle id="arcCap" class="arc-cap" cx="100" cy="8" r="3" fill="#fff"></circle>
          </svg>
        </div>

        <div id="orbWrap" class="orb-wrap">
          <div class="orb-ring-slow"></div>
          <div id="orbRing" class="orb-ring"></div>
          <div class="liquid-glass orb-glass orb-circle">
            <div class="glass-dispersion"></div>
          </div>
          <div class="specular-orbit"></div>
          <div class="orb-inner-shadow"></div>
          <div id="burstWaves" class="burst-waves"></div>
        </div>

        <div class="logo-wrap">
          <div id="logoMorph" class="logo-morph boot-logo-in logo-idle">
            <svg class="apple-mark" viewBox="0 0 814 1000" fill="currentColor">
              <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z" />
            </svg>
            <div class="boot-glint-wrap"><div class="boot-glint"></div></div>
          </div>
        </div>

        <div class="percent-wrap">
          <span id="centerPercent" class="soft-in center-percent">
            <span id="centerRoll" class="tabular-roll"></span><span class="percent-sign-small">%</span>
          </span>
        </div>

        <div id="belowOrb" class="below-orb soft-in">
          <div id="phaseText" class="phase-text blur-replace">
            <h1 id="phaseTitle" class="phase-title"></h1>
            <p id="phaseCaption" class="phase-caption"></p>
          </div>

          <div class="status-row">
            <span id="statusDot" class="status-dot ticker-dot"></span>
            <span id="statusLine" class="ticker-line mono status-line"></span>
          </div>

          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
            <div id="progressSheen" class="progress-sheen"></div>
          </div>

          <div id="stepDots" class="step-dots"></div>

          <p id="elapsedText" class="elapsed-text mono"></p>
        </div>
      </div>
    </div>

    <div id="handoffSweep" class="handoff-sweep" style="display:none"></div>

    <div id="handoffToast" class="handoff-wrap" style="display:none">
      <div class="handoff-card liquid-glass">
        <div class="glass-dispersion" style="border-radius:22px; opacity:0.35;"></div>
        <div class="handoff-row">
          <span class="handoff-check">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path class="check-draw" d="M6.8 12.5 10.4 16 17.2 8.6" stroke="#30D158" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div class="handoff-text">
            <p class="handoff-title">Khởi động hoàn tất</p>
            <p class="handoff-sub">Đang chuyển vào màn hình chính…</p>
          </div>
        </div>
        <div class="handoff-track">
          <div id="handoffBar" class="handoff-bar"></div>
        </div>
      </div>
    </div>

    <button id="themeToggle" type="button" class="theme-toggle liquid-glass" aria-label="Chuyển giao diện">
      <span class="theme-icon-wrap">
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
      </span>
    </button>

    <div class="loader-bottom-bar">
      <div class="home-bar"></div>
    </div>
  </div>

  <div id="sparkleLayer" class="spark-layer" style="display:none"></div>
</div>

<script src="script.js"></script>
</body>
</html>
